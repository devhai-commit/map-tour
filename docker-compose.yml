services:
  postgres:
    image: postgres:16-alpine
    container_name: lang-uoc-le-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - lang_uoc_le_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Giao diện quản trị DB nhẹ, KHÔNG chạy mặc định.
  # Bật khi cần: docker compose --profile tools up -d
  adminer:
    image: adminer:4
    container_name: lang-uoc-le-db-adminer
    restart: unless-stopped
    profiles: ['tools']
    ports:
      - '${ADMINER_PORT:-8081}:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lang_uoc_le_pgdata:
