services:
  postgres:
    image: postgres:16-alpine
    container_name: lang-uoc-le-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - lang_uoc_le_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # API cho map-tour — đọc dữ liệu từ Postgres, kết nối qua network Docker
  # nội bộ (không cần publish port 5432 ra ngoài cho service này).
  api:
    build: ./map-tour/server
    container_name: lang-uoc-le-db-api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_PORT: 8787
      CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:5173}
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
    ports:
      - '${API_PORT:-8787}:8787'
    depends_on:
      postgres:
        condition: service_healthy
      osrm:
        condition: service_started

  # Dịch vụ định tuyến (chỉ đường đi bộ) — dữ liệu do map-tour/routing/build.ps1
  # (hoặc build.sh) chuẩn bị trước, KHÔNG publish port ra ngoài: chỉ service
  # `api` gọi tới qua network Docker nội bộ (http://osrm:5000), giống cách
  # `postgres` chỉ được `api` truy cập trực tiếp.
  osrm:
    image: osrm/osrm-backend
    container_name: lang-uoc-le-db-osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/uoc-le.osrm
    volumes:
      - ./map-tour/routing/data:/data:ro

  # Giao diện quản trị DB nhẹ, KHÔNG chạy mặc định.
  # Bật khi cần: docker compose --profile tools up -d
  adminer:
    image: adminer:4
    container_name: lang-uoc-le-db-adminer
    restart: unless-stopped
    profiles: ['tools']
    ports:
      - '${ADMINER_PORT:-8081}:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lang_uoc_le_pgdata:
